server:
  port: 9000

spring:
  profiles:
    active: local

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${google.client-id}
            client-secret: ${google.client-secret}
            scope:
              - openid
              - profile
              - email

  threads:
    virtual:
      enabled: true

  data:

    web:
      pageable:
        default-page-size: 5
        max-page-size: 50

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${app.mail.username}
    password: ${app.mail.password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

logging:
  config: classpath:log4j2/log4j2-local.xml

app:
  mail:
    personal: '관리자'
    app-name: '도서 관리 시스템'
    from-name: '도서 관리 시스템'
    subject: '[도서 관리 시스템] 안녕하세요. 도서 관리 시스템 입니다.'
    default-user-name: '회원'

  signup:
    verification:
      expire-email-minutes: 3
      expire-signup-minutes: 10

external:
  nl-library:
    base-url: https://www.nl.go.kr
    api-key: ${external.nl-library.api-key}
    api-path:
      isbn: /seoji/SearchApi.do