<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>개발 중 페이지</title>

    <th:block th:replace="~{admin/common/admin-page-assets :: assets}"></th:block>

    <style>
        .work-in-progress-page {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: calc(100vh - 120px);
            padding: 32px;
        }

        .work-in-progress {
            width: 100%;
            max-width: 720px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 64px 32px;

            background: #ffffff;

            border: 1px dashed #d7dce3;
            border-radius: 28px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        .work-in-progress__badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 8px 14px;
            margin-bottom: 20px;

            border-radius: 999px;

            background: #fef3c7;
            color: #92400e;

            font-size: 13px;
            font-weight: 700;
        }

        .work-in-progress__icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        .work-in-progress__title {
            margin: 0 0 16px;

            font-size: 32px;
            font-weight: 800;
            line-height: 1.3;

            color: #111827;
        }

        .work-in-progress__desc {
            margin: 0;

            font-size: 16px;
            line-height: 1.8;

            color: #6b7280;
        }

        .work-in-progress__actions {
            display: flex;
            gap: 12px;

            margin-top: 32px;
        }

        .work-in-progress__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 44px;
            padding: 0 18px;

            border-radius: 12px;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            transition:
                    background-color 0.2s ease,
                    transform 0.2s ease,
                    border-color 0.2s ease;
        }

        .work-in-progress__button:hover {
            transform: translateY(-1px);
        }

        .work-in-progress__button--primary {
            background: #111827;
            color: #ffffff;
        }

        .work-in-progress__button--primary:hover {
            background: #1f2937;
        }

        .work-in-progress__button--secondary {
            border: 1px solid #d1d5db;

            background: #ffffff;
            color: #374151;
        }

        .work-in-progress__button--secondary:hover {
            background: #f9fafb;
        }
    </style>
</head>

<body>
<div class="admin-page">
    <aside th:replace="~{admin/common/sidebar :: sidebar()}"></aside>

    <main class="admin-main">
        <th:block th:replace="~{admin/common/fragments/page-hero :: pageHero(
            eyebrow='COMING SOON',
            title='현재 개발 중인 페이지입니다',
            desc='기능 구현 및 UI 개선 작업이 진행되고 있습니다.'
        )}">
        </th:block>

        <section class="work-in-progress-page">
            <div class="work-in-progress">
                <div class="work-in-progress__badge">
                    WORK IN PROGRESS
                </div>

                <div class="work-in-progress__icon">
                    🛠️
                </div>

                <h2 class="work-in-progress__title">
                    페이지 준비 중
                </h2>

                <p class="work-in-progress__desc">
                    현재 해당 기능은 개발 중입니다.<br>
                    안정적인 서비스 제공을 위해 순차적으로 업데이트될 예정입니다.
                </p>

                <div class="work-in-progress__actions">
                    <a th:href="@{/admin}" class="work-in-progress__button work-in-progress__button--primary">
                        대시보드로 이동
                    </a>

                    <a href="javascript:history.back()"
                       class="work-in-progress__button work-in-progress__button--secondary">
                        이전 페이지
                    </a>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
