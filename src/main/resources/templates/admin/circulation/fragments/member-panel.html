<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="memberPanelHeaderActions">
    <button
            type="button"
            class="btn btn--search"
            data-role="open-member-search">
        🔍 회원 검색
    </button>
</th:block>

<th:block th:fragment="memberPanelFooterActions">
    <button
            type="button"
            class="btn btn--accent"
            data-role="borrow-action"
            disabled>
        대출
    </button>

    <button
            type="button"
            class="btn btn--action"
            data-role="return-action"
            disabled>
        반납
    </button>
</th:block>

<th:block th:fragment="memberPanel">

    <section class="panel-layout table-layout--fixed-height">

        <div class="panel-layout__content">

            <th:block th:replace="~{admin/common/table-layout :: tableHeader(
                title='회원 조회',
                caption='선택된 회원의 정보를 확인할 수 있습니다.',
                actions=~{::memberPanelHeaderActions}
            )}"></th:block>

            <div class="panel-layout__body member-panel__body">
                <section class="panel-layout__body-empty member-empty-state"
                         id="selectedMemberEmpty">
                    <div class="member-empty-state__icon">👤</div>

                    <h4 class="member-empty-state__title">
                        선택된 회원이 없습니다
                    </h4>

                    <p class="member-empty-state__desc">
                        우측 상단의 검색 버튼을 눌러 회원을 조회하세요.
                    </p>
                </section>

                <section class="member-result is-hidden" id="selectedMemberResult">
                    <div class="member-info-card">
                        <div class="member-info-card__top">
                            <div class="member-info-card__identity">
                                <p class="member-info-card__eyebrow">
                                    Selected member
                                </p>

                                <div class="member-info-card__name-row">
                                    <h4 class="member-info-card__name" data-member-field="name">
                                        -
                                    </h4>

                                    <span class="member-info-card__member-no-chip" data-member-field="memberNo">
                                        -
                                    </span>
                                </div>

                                <p class="member-info-card__meta" data-member-meta>
                                    선택된 회원의 기본 정보를 확인할 수 있습니다.
                                </p>
                            </div>
                        </div>

                        <div class="member-info-card__body">
                            <div class="member-info-card__info">
                                <div class="member-info-card__info-row">
                                    <span class="member-info-card__label">회원 ID</span>
                                    <span class="member-info-card__value" data-member-field="loginId">-</span>
                                </div>

                                <div class="member-info-card__info-row">
                                    <span class="member-info-card__label">이메일</span>
                                    <span class="member-info-card__value" data-member-field="email">-</span>
                                </div>

                                <div class="member-info-card__info-row">
                                    <span class="member-info-card__label">상태</span>
                                    <span class="member-info-card__value">대출 처리 가능</span>
                                </div>
                            </div>

                            <p class="member-info-card__notice">
                                현재 선택된 회원 기준으로 대출/반납 처리가 진행됩니다.
                            </p>
                        </div>
                    </div>
                </section>
            </div>

            <div class="member-panel__footer-wrap is-hidden"
                 id="memberActionFooter"
                 aria-hidden="true">

                <th:block th:replace="~{admin/common/table-layout :: tableFooter(~{::memberPanelFooterActions})}"></th:block>

            </div>

        </div>

    </section>

</th:block>

</body>
</html>
