<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="memberSearchModal">

    <div class="member-search-modal is-hidden"
         id="memberSearchModal"
         aria-hidden="true">

        <div class="member-search-modal__backdrop"
             data-role="close-member-search"></div>

        <section class="member-search-modal__dialog"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="memberSearchModalTitle">

            <div class="member-search-modal__header">
                <div class="member-search-modal__header-main">
                    <p class="member-search-modal__eyebrow">MEMBER SEARCH</p>
                    <h3 class="member-search-modal__title" id="memberSearchModalTitle">회원 조회</h3>
                    <p class="member-search-modal__desc">
                        회원명, 회원번호, 이메일로 검색하여 반납을 진행할 회원을 선택할 수 있습니다.
                    </p>
                </div>

                <button type="button"
                        class="member-search-modal__close"
                        aria-label="회원 조회 닫기"
                        data-role="close-member-search">
                    ✕
                </button>
            </div>

            <div class="member-search-modal__body">
                <div class="member-search-result"
                     data-role="member-search-result-mount"
                     th:data-fragment-url="@{/admin/members/search}">
                </div>
            </div>

        </section>
    </div>

</th:block>


<th:block th:fragment="memberSearchResultPanel"
          th:with="TABLE_MODE_AJAX='ajax'">

    <section class="member-search-result"
             id="memberSearchResultPanel"
             th:data-fragment-url="@{/admin/members/search}">

        <div class="table-layout table-layout--auto-height">

            <th:block th:replace="~{admin/common/table-layout :: tableToolbar(
                searchMode=${TABLE_MODE_AJAX}
            )}"></th:block>

            <div class="table-layout__body">
                <table class="table-layout__table">
                    <thead class="table-layout__thead">
                    <tr class="table-layout__row table-layout__row--head">
                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--leading">
                            <span class="table-layout__text">No</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">회원 번호</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">회원명</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">이메일</span>
                        </th>
                    </tr>
                    </thead>

                    <tbody class="table-layout__tbody">
                    <tr class="table-layout__row table-layout__row--clickable"
                        th:each="member, stat : ${content}"
                        data-role="select-member"
                        tabindex="0"
                        th:data-member-id="${member.id}"
                        th:data-member-no="${member.memberNo}"
                        th:data-member-name="${member.name}"
                        th:data-member-email="${member.email}">

                        <td class="table-layout__cell table-layout__cell--leading">
                            <span class="table-layout__text"
                                  th:text="${pageMetaData.page * pageMetaData.size + stat.index + 1}">
                                1
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span class="table-layout__text"
                                  th:text="${member.memberNo}">
                                M0001
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--primary table-layout__cell--center-start">
                            <span class="table-layout__text"
                                  th:text="${member.name}">
                                홍길동
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span class="table-layout__text"
                                  th:text="${member.email}">
                                user@example.com
                            </span>
                        </td>
                    </tr>

                    <tr class="table-layout__row table-layout__row--empty"
                        th:if="${content == null or #lists.isEmpty(content)}">
                        <td class="table-layout__cell table-layout__cell--empty"
                            colspan="4">
                            검색 결과가 없습니다.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <th:block th:replace="~{common/pagination :: pagination(
                paginationMode=${TABLE_MODE_AJAX}
            )}"></th:block>

        </div>
    </section>

</th:block>

</body>
</html>
