<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="returnBookHeaderActions">
    <button type="button"
            class="btn btn--cancel"
            id="resetReturnBookButton"
            disabled>
        선택 해제
    </button>

    <button type="button"
            class="btn btn--submit"
            id="confirmReturnBookButton"
            disabled>
        반납 확인
    </button>
</th:block>

<th:block th:fragment="bookReturnPanel"
          th:with="TABLE_MODE_AJAX='ajax'">

    <section class="panel-layout table-layout table-layout--fixed-height"
             id="bookReturnModePanel"
             th:attr="data-fragment-url=@{admin/circulation/return/members/{memberId}/borrows(memberId=${memberId})}">

        <th:block th:replace="~{admin/common/table-layout :: tableHeader(
            title='반납 도서 목록',
            caption='회원의 반납 대상 도서를 선택해 반납 처리할 수 있습니다.',
            actions=~{::returnBookHeaderActions}
        )}"></th:block>

        <th:block th:replace="~{admin/common/table-layout :: tableToolbar(
            searchMode=${TABLE_MODE_AJAX}
        )}"></th:block>

        <div class="table-layout__body">
            <table class="table-layout__table return-table">

                <thead class="table-layout__thead">
                <tr class="table-layout__row table-layout__row--head">
                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--checkbox">
                        <span class="table-layout__text"></span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--leading">
                        <span class="table-layout__text">No</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">대출 ID</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">재고 ID</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">도서명</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">대출일</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">반납 예정일</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">연체 상태</span>
                    </th>
                </tr>
                </thead>

                <tbody class="table-layout__tbody" id="returnBookList">
                <tr th:each="item, itemStatus : ${content}"
                    class="table-layout__row table-layout__row--clickable return-table__row"
                    data-role="select-return-book"
                    role="button"
                    tabindex="0"
                    th:attr="data-borrow-record-id=${item.borrowRecordId}">

                    <td class="table-layout__cell table-layout__cell--checkbox">
                        <input type="checkbox"
                               class="return-table__checkbox"
                               data-role="return-book-checkbox"
                               tabindex="-1"
                               th:value="${item.borrowRecordId}"
                               th:attr="aria-label=${(item.bookTitle != null and !#strings.isEmpty(item.bookTitle))
                                      ? item.bookTitle + ' 반납 선택'
                                      : '반납 도서 선택'}">
                    </td>

                    <td class="table-layout__cell table-layout__cell--leading">
                            <span
                                    class="table-layout__text"
                                    th:text="${pageMetadata != null
                                        ? pageMetadata.page * pageMetadata.size + itemStatus.count
                                        : itemStatus.count}">
                                1
                            </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span class="table-layout__text"
                              th:text="${item.borrowRecordId != null ? item.borrowRecordId : '-'}">
                            101
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span class="table-layout__text"
                              th:text="${item.bookCopyId != null ? item.bookCopyId : '-'}">
                            1001
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--primary table-layout__cell--center-start">
                        <span class="table-layout__text"
                              th:text="${(item.bookTitle != null and !#strings.isEmpty(item.bookTitle))
                                    ? item.bookTitle
                                    : '-'}">
                            도서명
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span class="table-layout__text"
                              th:text="${item.borrowedAt != null
                                    ? #temporals.format(item.borrowedAt, 'yyyy-MM-dd')
                                    : '-'}">
                            2026-05-21
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span class="table-layout__text"
                              th:text="${item.dueAt != null
                                    ? #temporals.format(item.dueAt, 'yyyy-MM-dd')
                                    : '-'}">
                            2026-05-28
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start"
                        th:with="
                            returnStatusValue=${(item.returnStatus != null and item.returnStatus.value != null)
                                ? #strings.toLowerCase(item.returnStatus.value.toString())
                                : 'default'},
                            returnStatusLabel=${(item.returnStatus != null
                                    and item.returnStatus.label != null
                                    and !#strings.isEmpty(item.returnStatus.label))
                                ? item.returnStatus.label
                                : '-'}
                        ">
                        <span class="status-badge"
                              th:classappend="${' status-badge--' + returnStatusValue}"
                              th:text="${returnStatusLabel}">
                            연체 상태
                        </span>
                    </td>
                </tr>

                <tr class="table-layout__row table-layout__row--empty"
                    th:if="${content == null or #lists.isEmpty(content)}">
                    <td class="table-layout__cell table-layout__cell--empty"
                        colspan="8">
                        반납할 도서가 없습니다.
                    </td>
                </tr>
                </tbody>

            </table>
        </div>

        <th:block th:replace="~{admin/common/table-layout :: tablePagination(
            paginationMode=${TABLE_MODE_AJAX}
        )}"></th:block>

    </section>

</th:block>

</body>
</html>
