<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="bookPanel">

    <section class="panel-layout book-panel"
             data-mode="idle"
             id="bookPanel">

        <div class="panel-layout__body book-panel__body"
             id="bookPanelContent">

            <section class="book-empty-state"
                     id="bookPanelEmpty">
                <div class="book-empty-state__icon">📚</div>
                <h4 class="book-empty-state__title">대출 / 반납</h4>
                <p class="book-empty-state__desc">회원을 선택한 뒤 처리할 버튼을 눌러주세요.</p>
            </section>

        </div>

    </section>

</th:block>
</body>
</html>
