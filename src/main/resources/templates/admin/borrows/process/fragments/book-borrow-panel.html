<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="borrowBookHeaderActions">
    <button type="button"
            class="btn btn--search"
            data-role="open-borrow-book-search">
        🔍 도서 검색
    </button>
</th:block>

<th:block th:fragment="borrowBookFooterActions">
    <button type="button"
            class="btn btn--outline btn--action"
            data-role="reset-borrow-books"
            disabled>
        초기화
    </button>

    <button type="button"
            class="btn btn--primary btn--action"
            data-role="confirm-borrow"
            disabled>
        확인
    </button>
</th:block>

<th:block th:fragment="bookBorrowPanel">

    <section class="book-panel__mode-panel is-hidden"
             id="bookBorrowModePanel">

        <section class="book-borrow-table table-layout table-layout--reserve-space">

            <th:block th:replace="~{common/table-layout :: tableHeader(
                title='대출 도서 목록',
                caption='도서 검색으로 대출할 도서를 추가한 뒤 수량을 지정할 수 있습니다.',
                actions=~{::borrowBookHeaderActions}
            )}"></th:block>

            <div class="table-layout__body">
                <table class="table-layout__table book-borrow-table__table">

                    <thead class="table-layout__thead">
                    <tr class="table-layout__row table-layout__row--head">
                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--leading">
                            <span class="table-layout__text">No</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--fill-start">
                            <span class="table-layout__text">도서명</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">ISBN</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">재고</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">수량</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">관리</span>
                        </th>
                    </tr>
                    </thead>

                    <tbody class="table-layout__tbody"
                           id="borrowBookList">
                    <tr class="table-layout__row table-layout__row--empty"
                        id="borrowBookEmptyRow">
                        <td class="table-layout__cell table-layout__cell--empty"
                            colspan="6">
                            도서 검색 버튼을 눌러 대출할 도서를 선택해 주세요.
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

            <div class="table-layout__pagination table-layout__pagination--empty"
                 id="borrowBookPaginationWrap">
                <nav class="table-layout__pagination-nav"
                     id="borrowBookPagination"
                     data-pagination
                     aria-label="대출 도서 페이지네이션"></nav>
            </div>

            <th:block th:replace="~{common/table-layout :: tableFooter(~{::borrowBookFooterActions})}"></th:block>

        </section>

        <template id="borrowBookRowTemplate">
            <tr class="table-layout__row book-borrow-table__row">
                <td class="table-layout__cell table-layout__cell--leading">
                    <span class="table-layout__text"
                          data-field="index"></span>
                </td>

                <td class="table-layout__cell table-layout__cell--primary table-layout__cell--fill-start">
                    <span class="table-layout__text"
                          data-field="title"></span>
                </td>

                <td class="table-layout__cell table-layout__cell--muted table-layout__cell--center-start">
                    <span class="table-layout__text"
                          data-field="isbn"></span>
                </td>

                <td class="table-layout__cell table-layout__cell--center-start">
                    <span class="table-layout__text"
                          data-field="availableQuantity"></span>
                </td>

                <td class="table-layout__cell table-layout__cell--center-start">
                    <div class="book-borrow-table__quantity">
                        <button type="button"
                                class="btn btn--outline btn--sm book-borrow-table__quantity-button"
                                data-role="decrease-borrow-quantity"
                                aria-label="대출 수량 감소">
                            −
                        </button>

                        <input type="number"
                               class="book-borrow-table__quantity-input"
                               data-role="borrow-quantity-input"
                               min="1">

                        <button type="button"
                                class="btn btn--outline btn--sm book-borrow-table__quantity-button"
                                data-role="increase-borrow-quantity"
                                aria-label="대출 수량 증가">
                            +
                        </button>
                    </div>
                </td>

                <td class="table-layout__cell table-layout__cell--center-start">
                    <button type="button"
                            class="btn btn--outline btn--sm book-borrow-table__remove-button"
                            data-role="remove-borrow-book">
                        삭제
                    </button>
                </td>
            </tr>
        </template>

    </section>

</th:block>

</body>
</html>
