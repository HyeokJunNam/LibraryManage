<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대출 관리</title>

    <th:block th:replace="~{admin/common/admin-page-assets :: assets}"></th:block>

    <link rel="stylesheet" th:href="@{/css/admin/borrows/borrow-status/borrow-status.css}">
</head>

<body>
<div class="admin-page">
    <aside th:replace="~{admin/common/sidebar :: sidebar('borrow-status')}"></aside>

    <main class="admin-main">
        <th:block th:replace="~{admin/common/fragments/page-hero :: pageHero(
            eyebrow='BORROW STATUS',
            title='대출 / 연체 목록',
            desc='전체 대출 이력과 연체 현황을 한 화면에서 확인합니다.'
            )}">
        </th:block>

        <section class="borrow-page">
            <div class="borrow-page__content">

                <section class="borrow-page__section borrow-page__section--overdue">
                    <div id="overdueListPanel"
                         class="panel-layout borrow-page__panel"
                         th:attr="data-fragment-url=@{/admin/borrows/overdue}">
                        <div class="panel-layout__body">
                            <div class="borrow-page__loading">연체 목록을 불러오는 중입니다.</div>
                        </div>
                    </div>
                </section>

                <section class="borrow-page__section">
                    <div id="borrowListPanel"
                         class="panel-layout borrow-page__panel"
                         th:attr="data-fragment-url=@{/admin/borrows/list}">
                        <div class="panel-layout__body">
                            <div class="borrow-page__loading">대출 목록을 불러오는 중입니다.</div>
                        </div>
                    </div>
                </section>

            </div>
        </section>

    </main>

</div>

<th:block th:replace="~{common/modal-alert :: alertModal}"></th:block>
<script type="module" th:src="@{/js/admin/borrows/borrow-status/borrow-status.js}"></script>

</body>
</html>
