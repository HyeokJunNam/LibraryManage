<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<section
        th:fragment="bookCopies"
        class="panel-layout panel-layout--fixed-height table-layout table-layout--fixed-height book-detail-copies-card"
        id="bookDetailCopiesCard"
        th:data-book-id="${bookId}"
        th:data-fragment-url="@{/admin/books/{id}/copies(id=${bookId})}">

    <th:block th:replace="~{common/table-layout :: tableHeader(
        title='도서 재고 현황',
        caption='이 도서에 등록된 개별 재고의 상태를 확인합니다.',
        actions=~{::bookDetailActions}
    )}"></th:block>

    <div class="table-layout__body">
        <table class="table-layout__table">
            <thead class="table-layout__thead">
            <tr class="table-layout__row table-layout__row--head">
                <th class="table-layout__cell table-layout__cell--head table-layout__cell--leading">
                    <span class="table-layout__text">No</span>
                </th>

                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                    <span class="table-layout__text">재고 ID</span>
                </th>

                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                    <span class="table-layout__text">재고 상태</span>
                </th>

                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                    <span class="table-layout__text">재고 위치</span>
                </th>

                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                    <span class="table-layout__text">등록일</span>
                </th>

                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                    <span class="table-layout__text">대출 상태</span>
                </th>

                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                    <span class="table-layout__text">관리</span>
                </th>
            </tr>
            </thead>

            <tbody
                    id="bookDetailCopyRows"
                    class="table-layout__tbody">

            <tr
                    th:each="bookCopy, stat : ${content}"
                    class="table-layout__row book-detail-copies-table__row"
                    data-row-mode="clean"
                    th:data-book-copy-id="${bookCopy.bookCopyId}"
                    th:data-borrowed="${bookCopy.borrowStatus != null and bookCopy.borrowStatus.value == 'BORROWED'}"
                    th:data-original-condition="${bookCopy.bookCopyCondition != null ? bookCopy.bookCopyCondition.value : ''}"
                    th:data-original-location="${bookCopy.location != null ? bookCopy.location : ''}">

                <td class="table-layout__cell table-layout__cell--leading">
                    <span
                            class="book-detail-copy-row__index"
                            th:text="${pageMetaData != null
                                   ? (pageMetaData.page * pageMetaData.size + stat.index + 1)
                                   : (stat.index + 1)}">
                        1
                    </span>
                </td>

                <td class="table-layout__cell table-layout__cell--center-start">
                    <span
                            class="table-layout__text"
                            th:text="${bookCopy.bookCopyId != null ? bookCopy.bookCopyId : '-'}">
                        1
                    </span>
                </td>

                <td class="table-layout__cell table-layout__cell--center-start">
                    <span
                            class="book-detail-copy-condition-view status-badge"
                            th:classappend="${bookCopy.bookCopyCondition != null
                                           ? ' status-badge--' + #strings.toLowerCase(bookCopy.bookCopyCondition.value)
                                           : ' status-badge--default'}"
                            th:text="${(bookCopy.bookCopyCondition != null
                                    and bookCopy.bookCopyCondition.label != null
                                    and !#strings.isEmpty(bookCopy.bookCopyCondition.label))
                                   ? bookCopy.bookCopyCondition.label
                                   : '-'}">
                        재고 상태
                    </span>

                    <select
                            class="book-detail-copy-control book-detail-copy-condition-edit is-hidden"
                            data-field="condition"
                            th:classappend="${bookCopy.bookCopyCondition != null
                                               ? ' book-detail-copy-condition-edit--' + #strings.toLowerCase(bookCopy.bookCopyCondition.value)
                                               : ''}">
                        <option
                                th:each="conditionOption : ${conditionOptions}"
                                th:value="${conditionOption.value}"
                                th:text="${conditionOption.label}"
                                th:selected="${bookCopy.bookCopyCondition != null and bookCopy.bookCopyCondition.value == conditionOption.value}">
                            재고 상태
                        </option>
                    </select>
                </td>

                <td class="table-layout__cell table-layout__cell--center-start">
                    <span
                            class="book-detail-copy-location-view table-layout__text"
                            th:text="${(bookCopy.location != null and !#strings.isEmpty(bookCopy.location))
                                  ? bookCopy.location
                                  : '-'}">
                        A-01
                    </span>

                    <input
                            type="text"
                            class="book-detail-copy-control book-detail-copy-location-edit is-hidden"
                            data-field="location"
                            placeholder="예: A-01"
                            autocomplete="off"
                            th:value="${bookCopy.location != null ? bookCopy.location : ''}">
                </td>

                <td class="table-layout__cell table-layout__cell--center-start">
                    <span
                            class="table-layout__text"
                            th:text="${bookCopy.createdAt != null ? #temporals.format(bookCopy.createdAt, 'yyyy-MM-dd') : '-'}">
                        2026-04-30
                    </span>
                </td>

                <td class="table-layout__cell table-layout__cell--center-start">
                    <span
                            class="status-badge"
                            th:classappend="${bookCopy.borrowStatus != null
                                           ? ' status-badge--' + #strings.toLowerCase(bookCopy.borrowStatus.value)
                                           : ' status-badge--default'}"
                            th:text="${(bookCopy.borrowStatus != null
                                    and bookCopy.borrowStatus.label != null
                                    and !#strings.isEmpty(bookCopy.borrowStatus.label))
                                   ? bookCopy.borrowStatus.label
                                   : '-'}">
                        대출 상태
                    </span>
                </td>

                <td class="table-layout__cell table-layout__cell--center-start">
                    <span class="book-detail-copy-row__state">기존</span>

                    <button
                            type="button"
                            class="btn btn--danger btn--sm book-detail-copy-row__delete is-hidden"
                            data-role="mark-delete-row">
                        삭제
                    </button>

                    <button
                            type="button"
                            class="btn btn--outline btn--sm book-detail-copy-row__cancel-delete is-hidden"
                            data-role="cancel-delete-row">
                        취소
                    </button>
                </td>
            </tr>

            <tr
                    class="table-layout__row table-layout__row--empty"
                    th:if="${content == null or #lists.isEmpty(content)}">
                <td class="table-layout__cell table-layout__cell--empty">
                    등록된 재고가 없습니다.
                </td>
            </tr>
            </tbody>
        </table>

        <button
                type="button"
                class="book-detail-copies-add-row is-hidden"
                id="addBookCopyRowButton">
            <span class="book-detail-copies-add-row__icon">+</span>
            <span class="book-detail-copies-add-row__text">재고 행 추가</span>
        </button>
    </div>

    <th:block th:replace="~{common/table-layout :: tablePagination(paginationMode='ajax')}"></th:block>

    <template id="bookDetailCopyRowTemplate">
        <tr class="table-layout__row book-detail-copies-table__row book-detail-copies-table__row--created">

            <td class="table-layout__cell table-layout__cell--leading">
                <span class="book-detail-copy-row__index">신규</span>
            </td>

            <td class="table-layout__cell table-layout__cell--center-start">
                <span class="book-detail-copy-row__new-label">신규</span>
            </td>

            <td class="table-layout__cell table-layout__cell--center-start">
                <select
                        class="book-detail-copy-control book-detail-copy-condition-edit"
                        data-field="condition">
                    <option
                            th:each="conditionOption : ${conditionOptions}"
                            th:value="${conditionOption.value}"
                            th:text="${conditionOption.label}">
                        재고 상태
                    </option>
                </select>
            </td>

            <td class="table-layout__cell table-layout__cell--fill-start">
                <input
                        type="text"
                        class="book-detail-copy-control book-detail-copy-location-edit"
                        data-field="location"
                        placeholder="예: A-01"
                        autocomplete="off">
            </td>

            <td class="table-layout__cell table-layout__cell--center-start">
                <span class="table-layout__text">-</span>
            </td>

            <td class="table-layout__cell table-layout__cell--center-start">
                <span class="table-layout__text">-</span>
            </td>

            <td class="table-layout__cell table-layout__cell--center-start">
                <button
                        type="button"
                        class="btn btn--danger btn--sm book-detail-copy-row__remove"
                        data-role="remove-created-row">
                    삭제
                </button>
            </td>
        </tr>
    </template>

    <template id="bookDetailCopyEmptyRowTemplate">
        <tr class="table-layout__row table-layout__row--empty">
            <td class="table-layout__cell table-layout__cell--empty">
                등록된 신규 재고가 없습니다.
            </td>
        </tr>
    </template>

</section>

<th:block th:fragment="bookDetailActions">
    <button
            type="button"
            class="btn btn--primary book-detail-copies-card__edit-button"
            id="editBookCopiesButton">
        재고 수정
    </button>

    <div class="book-detail-copies-card__edit-actions is-hidden" id="bookCopyEditActions">
        <button
                type="button"
                class="btn btn--primary book-detail-copies-card__save-button"
                id="saveBookCopiesButton">
            저장
        </button>

        <button
                type="button"
                class="btn btn--ghost book-detail-copies-card__cancel-button"
                id="cancelBookCopiesButton">
            취소
        </button>
    </div>
</th:block>

</body>
</html>
