<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 등록</title>

    <th:block th:replace="~{admin/common/admin-page-assets :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/book/books-new.css}">
</head>
<body>
<div class="admin-page">
    <aside th:replace="~{admin/common/sidebar :: sidebar('books')}"></aside>

    <main class="admin-main"
          id="bookCreatePage"
          th:data-create-url="@{/api/books}"
          th:data-isbn-lookup-url="@{/api/books/lookup}">

        <th:block th:replace="~{admin/common/fragments/page-hero :: pageHero(
            eyebrow='BOOK REGISTRATION',
            title='도서 등록',
            desc='ISBN으로 도서 정보를 불러오거나 직접 입력한 뒤, 등록 예정 목록에 추가하여 한 번에 저장할 수 있습니다.'
        )}">
        </th:block>

        <section class="book-create-layout">
            <section class="book-create-left">
                <section class="panel-layout table-layout table-layout--fixed-height isbn-lookup-card">
                    <th:block th:replace="~{admin/common/table-layout :: tableHeader(
                        title='ISBN으로 도서 정보 불러오기',
                        caption='ISBN을 입력하면 외부 도서 정보를 조회해 입력 폼에 채울 수 있습니다.',
                        actions=null
                    )}"></th:block>

                    <div class="table-layout__body isbn-lookup-card__body">
                        <div class="field">
                            <label for="isbnLookupKeyword" class="field__label">조회할 ISBN</label>

                            <div class="isbn-lookup-card__control">
                                <input id="isbnLookupKeyword"
                                       type="text"
                                       class="field__control"
                                       placeholder="예: 9788966260959"
                                       autocomplete="off">

                                <button type="button"
                                        class="btn btn--action"
                                        id="lookupBookByIsbnButton">
                                    정보 불러오기
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="panel-layout table-layout table-layout--fixed-height book-input-card">
                    <th:block th:replace="~{admin/common/table-layout :: tableHeader(
                        title='도서 정보 입력',
                        caption='등록 예정 목록에 추가할 도서 정보를 확인하거나 직접 입력하세요.',
                        actions=null
                    )}"></th:block>

                    <div class="table-layout__body book-input-card__body">
                        <form class="book-input-form" id="bookDraftForm">
                            <div class="book-image-row">
                                <div class="book-image-preview" id="bookImagePreview">
                                    <div class="book-image-preview__dummy">
                                        <span class="book-image-preview__mark">BOOK</span>
                                        <span class="book-image-preview__text">도서 이미지</span>
                                    </div>
                                </div>

                                <div class="book-image-row__fields">
                                    <div class="field">
                                        <label for="thumbnailUrl" class="field__label">도서 이미지</label>
                                        <input id="thumbnailUrl"
                                               type="text"
                                               class="field__control"
                                               placeholder="이미지 URL"
                                               autocomplete="off">
                                    </div>

                                    <p class="book-help-text">
                                        이미지 URL을 입력하면 등록 후 도서 상세 화면과 목록 미리보기에 반영됩니다.
                                    </p>
                                </div>
                            </div>

                            <div class="field">
                                <label for="isbn" class="field__label">
                                    ISBN <span class="book-required">*</span>
                                </label>
                                <input id="isbn"
                                       type="text"
                                       class="field__control"
                                       placeholder="등록할 도서의 ISBN"
                                       autocomplete="off">
                            </div>

                            <div class="field">
                                <label for="title" class="field__label">
                                    도서명 <span class="book-required">*</span>
                                </label>
                                <input id="title"
                                       type="text"
                                       class="field__control"
                                       placeholder="도서명을 입력하세요"
                                       autocomplete="off">
                            </div>

                            <div class="book-field-grid">
                                <div class="field">
                                    <label for="author" class="field__label">
                                        저자 <span class="book-required">*</span>
                                    </label>
                                    <input id="author"
                                           type="text"
                                           class="field__control"
                                           placeholder="저자"
                                           autocomplete="off">
                                </div>

                                <div class="field">
                                    <label for="publisher" class="field__label">
                                        출판사 <span class="book-required">*</span>
                                    </label>
                                    <input id="publisher"
                                           type="text"
                                           class="field__control"
                                           placeholder="출판사"
                                           autocomplete="off">
                                </div>
                            </div>

                            <div class="field">
                                <label for="location" class="field__label">
                                    위치 <span class="book-required">*</span>
                                </label>
                                <input id="location"
                                       type="text"
                                       class="field__control"
                                       placeholder="예: A-01"
                                       autocomplete="off">
                            </div>

                            <div class="field">
                                <label for="description" class="field__label">도서 설명</label>
                                <textarea id="description"
                                          class="field__control book-description"
                                          placeholder="도서 설명을 입력하세요"></textarea>
                            </div>

                            <div class="book-input-form__actions">
                                <button type="button"
                                        class="btn btn--action"
                                        id="addBookDraftButton">
                                    등록 예정 목록에 추가
                                </button>
                            </div>
                        </form>
                    </div>
                </section>
            </section>

            <section class="panel-layout table-layout table-layout--fixed-height book-draft-panel">
                <th:block th:replace="~{admin/common/table-layout :: tableHeader(
                    title='등록 예정 도서 목록',
                    caption='왼쪽에서 추가한 도서들을 확인하고 한 번에 저장합니다.',
                    actions=~{::draftHeaderActions}
                )}"></th:block>

                <div class="table-layout__body book-draft-panel__body">
                    <div class="panel-layout__empty book-draft-empty" id="bookDraftEmpty">
                        <div>
                            <div class="book-draft-empty__icon">📚</div>
                            <h4 class="book-draft-empty__title">등록 예정 도서가 없습니다</h4>
                            <p class="book-draft-empty__desc">
                                ISBN으로 정보를 불러오거나 직접 입력한 뒤, 왼쪽의 등록 예정 목록에 추가 버튼을 눌러주세요.
                            </p>
                        </div>
                    </div>

                    <div class="book-draft-table-wrap is-hidden" id="bookDraftTableWrap">
                        <table class="table-layout__table book-draft-table">
                            <thead class="table-layout__thead">
                            <tr class="table-layout__row table-layout__row--head">
                                <th class="table-layout__cell table-layout__cell--head table-layout__cell--leading">
                                    <span class="table-layout__text">No</span>
                                </th>

                                <th class="table-layout__cell table-layout__cell--head table-layout__cell--fill-start">
                                    <span class="table-layout__text">도서명</span>
                                </th>

                                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                                    <span class="table-layout__text">ISBN</span>
                                </th>

                                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                                    <span class="table-layout__text">저자</span>
                                </th>

                                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                                    <span class="table-layout__text">출판사</span>
                                </th>

                                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                                    <span class="table-layout__text">위치</span>
                                </th>

                                <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                                    <span class="table-layout__text">관리</span>
                                </th>
                            </tr>
                            </thead>

                            <tbody class="table-layout__tbody" id="bookDraftRows"></tbody>
                        </table>
                    </div>
                </div>

                <div id="bookDraftPagination" class="book-draft-pagination is-hidden">
                    <th:block th:replace="~{common/pagination :: pagination(
                        paginationMode='client'
                    )}"></th:block>
                </div>

                <template id="bookDraftRowTemplate">
                    <tr class="table-layout__row book-draft-row">
                        <td class="table-layout__cell table-layout__cell--leading">
                            <span class="table-layout__text" data-field="index"></span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--primary table-layout__cell--fill-start">
                            <span class="table-layout__text" data-field="title"></span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span class="table-layout__text" data-field="isbn"></span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span class="table-layout__text" data-field="author"></span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span class="table-layout__text" data-field="publisher"></span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span class="table-layout__text" data-field="location"></span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start book-draft-table__action-cell">
                            <button type="button"
                                    class="btn btn--danger"
                                    data-role="remove-book-draft">
                                삭제
                            </button>
                        </td>
                    </tr>
                </template>
            </section>
        </section>
    </main>
</div>

<th:block th:fragment="draftHeaderActions">
    <button type="button"
            class="btn btn--cancel"
            id="clearBookDraftButton"
            disabled>
        전체 비우기
    </button>

    <button type="button"
            class="btn btn--submit"
            id="saveBookBatchButton"
            disabled>
        저장
    </button>
</th:block>

<th:block th:replace="~{common/modal-alert :: alertModal}"></th:block>

<script th:src="@{/js/admin/book/book-new.js}"></script>
</body>
</html>
