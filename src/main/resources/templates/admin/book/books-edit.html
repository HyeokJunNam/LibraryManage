<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 수정</title>

    <th:block th:replace="~{admin/common/admin-page-assets :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/book/books-edit.css}">
</head>
<body>
<div class="admin-page">
    <aside th:replace="~{admin/common/sidebar :: sidebar('books')}"></aside>

    <main class="admin-main">
        <th:block th:replace="~{admin/common/fragments/page-hero :: pageHero(
            eyebrow='BOOK EDIT',
            title=${book.title},
            desc='등록된 도서의 기본 정보를 수정합니다.'
        )}">
        </th:block>

        <section class="book-edit-layout">

            <section class="panel-layout table-layout book-edit-card">

                <th:block th:replace="~{admin/common/table-layout :: tableHeader(
                    title='도서 정보 수정',
                    caption='도서명, ISBN, 저자, 출판사, 위치, 설명 정보를 수정합니다.',
                    actions=~{::headerActions}
                )}"></th:block>

                <div class="table-layout__body book-edit-card__body">

                    <form class="book-edit-form" id="bookEditForm">

                        <input type="hidden"
                               id="bookId"
                               th:value="${book.id}">

                        <div class="book-image-row">
                            <div class="book-image-preview" id="bookImagePreview">
                                <img
                                        th:if="${book.thumbnailUrl != null and !#strings.isEmpty(book.thumbnailUrl)}"
                                        th:src="${book.thumbnailUrl}"
                                        th:alt="${book.title}"
                                        class="book-image-preview__image">

                                <div
                                        th:unless="${book.thumbnailUrl != null and !#strings.isEmpty(book.thumbnailUrl)}"
                                        class="book-image-preview__dummy">
                                    <span class="book-image-preview__mark">BOOK</span>
                                    <span class="book-image-preview__text">도서 이미지</span>
                                </div>
                            </div>

                            <div class="book-image-row__fields">
                                <div class="field">
                                    <label for="thumbnailUrl" class="field__label">도서 이미지</label>
                                    <input
                                            id="thumbnailUrl"
                                            type="text"
                                            class="field__control"
                                            placeholder="이미지 URL"
                                            autocomplete="off"
                                            th:value="${book.thumbnailUrl}">
                                </div>

                                <p class="book-help-text">
                                    이미지 URL을 변경하면 도서 상세 화면과 목록 미리보기에 반영됩니다.
                                </p>
                            </div>
                        </div>

                        <div class="book-field-grid">

                            <div class="field">
                                <label for="isbn" class="field__label">
                                    ISBN <span class="book-required">*</span>
                                </label>
                                <input
                                        id="isbn"
                                        type="text"
                                        class="field__control"
                                        placeholder="ISBN"
                                        autocomplete="off"
                                        th:value="${book.isbn}">
                            </div>

                            <div class="field">
                                <label for="title" class="field__label">
                                    도서명 <span class="book-required">*</span>
                                </label>
                                <input
                                        id="title"
                                        type="text"
                                        class="field__control"
                                        placeholder="도서명을 입력하세요"
                                        autocomplete="off"
                                        th:value="${book.title}">
                            </div>

                            <div class="field">
                                <label for="author" class="field__label">
                                    저자 <span class="book-required">*</span>
                                </label>
                                <input
                                        id="author"
                                        type="text"
                                        class="field__control"
                                        placeholder="저자"
                                        autocomplete="off"
                                        th:value="${book.author}">
                            </div>

                            <div class="field">
                                <label for="publisher" class="field__label">
                                    출판사 <span class="book-required">*</span>
                                </label>
                                <input
                                        id="publisher"
                                        type="text"
                                        class="field__control"
                                        placeholder="출판사"
                                        autocomplete="off"
                                        th:value="${book.publisher}">
                            </div>

                            <div class="field book-field-grid__full">
                                <label for="location" class="field__label">위치</label>
                                <input
                                        id="location"
                                        type="text"
                                        class="field__control"
                                        placeholder="예: A-01"
                                        autocomplete="off"
                                        th:value="${book.location}">
                            </div>

                        </div>

                        <div class="field">
                            <label for="description" class="field__label">도서 설명</label>
                            <textarea
                                    id="description"
                                    class="field__control book-description"
                                    placeholder="도서 설명을 입력하세요"
                                    th:text="${book.description}"></textarea>
                        </div>

                    </form>

                </div>
            </section>

        </section>

    </main>
</div>

<th:block th:fragment="headerActions">
    <a th:href="@{/admin/books/{bookId}(bookId=${book.id})}"
       class="btn btn--cancel">
        취소
    </a>

    <button type="button"
            id="saveBookButton"
            class="btn btn--submit">
        저장
    </button>
</th:block>

<th:block th:replace="~{common/modal-alert :: alertModal}"></th:block>

<script th:src="@{/js/admin/book/book-edit.js}"></script>

</body>
</html>
