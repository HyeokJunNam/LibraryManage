<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리</title>

    <th:block th:replace="~{admin/common/admin-page-assets :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/members/members.css}">
</head>
<body>
<div class="admin-page">
    <aside th:replace="~{admin/common/sidebar :: sidebar('members')}"></aside>

    <main class="admin-main">
        <th:block th:replace="~{admin/common/fragments/page-hero :: pageHero(
            eyebrow='MEMBER MANAGEMENT',
            title='회원 목록 관리',
            desc='전체 회원을 조회하고 회원 정보 및 상태를 확인할 수 있습니다.'
        )}">
        </th:block>

        <section class="statistics-grid">
            <article class="statistics-card">
                <p class="statistics-card__label">전체 회원 수</p>
                <strong
                        class="statistics-card__value"
                        th:text="${memberStatistics != null ? memberStatistics.totalMemberCount : 0}">
                    0
                </strong>
            </article>

            <article class="statistics-card">
                <p class="statistics-card__label">당일 대출 회원 수</p>
                <strong
                        class="statistics-card__value"
                        th:text="${memberStatistics != null ? memberStatistics.todayBorrowMemberCount : 0}">
                    0
                </strong>
            </article>

            <article class="statistics-card">
                <p class="statistics-card__label">현재 대출 회원 수</p>
                <strong
                        class="statistics-card__value"
                        th:text="${memberStatistics != null ? memberStatistics.currentBorrowMemberCount : 0}">
                    0
                </strong>
            </article>

            <article class="statistics-card">
                <p class="statistics-card__label">현재 연체 회원 수</p>
                <strong
                        class="statistics-card__value"
                        th:text="${memberStatistics != null ? memberStatistics.currentOverdueMemberCount : 0}">
                    0
                </strong>
            </article>
        </section>

        <section class="panel-layout table-layout table-layout--fixed-height">

            <th:block th:replace="~{common/table-layout :: tableHeader(
                title='회원 목록',
                caption='등록된 회원을 검색하고, 선택한 회원의 상세 정보를 확인할 수 있습니다.',
                actions=null
            )}"></th:block>

            <th:block th:replace="~{common/table-layout :: tableToolbar(searchMode='server')}"></th:block>

            <div class="table-layout__body">
                <table class="table-layout__table members-table">
                    <thead class="table-layout__thead">
                    <tr class="table-layout__row table-layout__row--head">
                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--leading">
                            <span class="table-layout__text">No</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">회원 번호</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">ID</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">이름</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">이메일</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">연락처</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">권한</span>
                        </th>

                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                            <span class="table-layout__text">가입일</span>
                        </th>
                    </tr>
                    </thead>

                    <tbody class="table-layout__tbody">
                    <tr
                            class="table-layout__row table-layout__row--clickable"
                            th:each="row, rowStat : ${content}"
                            th:attr="data-member-url=@{/admin/members/{id}(id=${row.id})},
                                     tabindex=0,
                                     role='link',
                                     aria-label=${row.name + ' 상세 정보 보기'}">

                        <td class="table-layout__cell table-layout__cell--leading">
                            <span
                                    class="table-layout__text"
                                    th:text="${pageMetadata != null
                                        ? pageMetadata.page * pageMetadata.size + rowStat.count
                                        : rowStat.count}">
                                1
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span
                                    class="table-layout__text"
                                    th:text="${row.memberNo != null ? row.memberNo : '-'}">
                                19900101
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span
                                    class="table-layout__text"
                                    th:text="${row.loginId != null ? row.loginId : '-'}">
                                id
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--primary table-layout__cell--center-start">
                            <span
                                    class="table-layout__text"
                                    th:text="${row.name}">
                                홍길동
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span
                                    class="table-layout__text"
                                    th:text="${row.email != null ? row.email : '-'}">
                                hong@example.com
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span
                                    class="table-layout__text"
                                    th:text="${row.phoneNumber != null ? row.phoneNumber : '-'}">
                                010-1234-5678
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span
                                    class="role-badge"
                                    th:classappend="${row.role == 'ROLE_ADMIN'} ? ' role-badge--admin' : ' role-badge--user'"
                                    th:text="${row.role == 'ROLE_ADMIN'} ? '관리자' : '일반 회원'">
                                일반 회원
                            </span>
                        </td>

                        <td class="table-layout__cell table-layout__cell--center-start">
                            <span
                                    class="table-layout__text"
                                    th:text="${row.createdAt != null ? #temporals.format(row.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                                2026-04-27 10:00
                            </span>
                        </td>
                    </tr>

                    <tr
                            class="table-layout__row table-layout__row--empty"
                            th:if="${content == null or #lists.isEmpty(content)}">
                        <td class="table-layout__cell table-layout__cell--empty">
                            조회 된 데이터가 없습니다.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <th:block th:replace="~{common/table-layout :: tablePagination(
                paginationMode='server'
            )}"></th:block>

        </section>

    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const rows = document.querySelectorAll(".table-layout__row--clickable");

        rows.forEach((row) => {
            const moveToDetail = () => {
                const url = row.dataset.memberUrl;

                if (url) {
                    window.location.href = url;
                }
            };

            row.addEventListener("click", moveToDetail);

            row.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    moveToDetail();
                }
            });
        });
    });
</script>
</body>
</html>
