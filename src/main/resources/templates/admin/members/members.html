<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리</title>

    <th:block th:replace="~{admin/common/admin-page-assets :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/members/members.css}">
</head>
<body>
<div class="admin-page">
    <aside th:replace="~{admin/common/sidebar :: sidebar('members')}"></aside>

    <main class="admin-main">

        <header class="page-hero">
            <div class="page-hero__content">
                <p class="page-hero__eyebrow">MEMBER MANAGEMENT</p>
                <h2 class="page-hero__title">회원 목록 관리</h2>
                <p class="page-hero__desc">
                    전체 회원을 조회하고 회원 정보 및 상태를 확인할 수 있습니다.
                </p>
            </div>
        </header>

        <section class="statistics-grid">
            <article class="statistics-card">
                <p class="statistics-card__label">전체 회원</p>
                <strong
                        class="statistics-card__value"
                        th:text="${memberSummary != null ? memberSummary.totalCount : 0}">
                    0
                </strong>
                <p class="statistics-card__meta">등록된 전체 회원 수</p>
            </article>

            <article class="statistics-card">
                <p class="statistics-card__label">활성 회원</p>
                <strong
                        class="statistics-card__value"
                        th:text="${memberSummary != null ? memberSummary.activeCount : 0}">
                    0
                </strong>
                <p class="statistics-card__meta">정상 이용 가능 회원</p>
            </article>

            <article class="statistics-card">
                <p class="statistics-card__label">휴면 회원</p>
                <strong
                        class="statistics-card__value"
                        th:text="${memberSummary != null ? memberSummary.inactiveCount : 0}">
                    0
                </strong>
                <p class="statistics-card__meta">최근 활동 이력이 적은 회원</p>
            </article>

            <article class="statistics-card">
                <p class="statistics-card__label">정지 회원</p>
                <strong
                        class="statistics-card__value"
                        th:text="${memberSummary != null ? memberSummary.suspendedCount : 0}">
                    0
                </strong>
                <p class="statistics-card__meta">이용 제한 상태 회원</p>
            </article>
        </section>

        <section class="members-table-layout table-layout">

            <th:block th:replace="~{common/table-layout :: tableHeader(
                title='회원 목록',
                caption='등록된 회원을 검색하고, 선택한 회원의 상세 정보를 확인할 수 있습니다.',
                actions=null
            )}"></th:block>

            <th:block th:replace="~{common/table-layout :: tableToolbar(searchMode='server')}"></th:block>

            <div class="table-layout__body">
                <table class="table-layout__table">
                    <thead class="table-layout__thead">
                    <tr class="table-layout__row table-layout__row--head">
                        <th class="table-layout__cell table-layout__cell--head table-layout__cell--leading">
                            <span class="table-layout__text"></span>
                        </th>
                        <th class="table-layout__cell table-layout__cell--head">
                            <span class="table-layout__text">이름</span>
                        </th>
                        <th class="table-layout__cell table-layout__cell--head">
                            <span class="table-layout__text">이메일</span>
                        </th>
                        <th class="table-layout__cell table-layout__cell--head">
                            <span class="table-layout__text">연락처</span>
                        </th>
                        <th class="table-layout__cell table-layout__cell--head">
                            <span class="table-layout__text">권한</span>
                        </th>
                        <th class="table-layout__cell table-layout__cell--head">
                            <span class="table-layout__text">가입일</span>
                        </th>
                    </tr>
                    </thead>

                    <tbody class="table-layout__tbody">
                    <tr
                            class="table-layout__row table-layout__row--clickable"
                            th:each="row : ${content}"
                            th:attr="data-member-url=@{/admin/members/{id}(id=${row.id})},
                                     tabindex=0,
                                     role='link',
                                     aria-label=${row.name + ' 상세 정보 보기'}">

                        <td class="table-layout__cell table-layout__cell--leading"></td>

                        <td class="table-layout__cell table-layout__cell--primary">
                                <span
                                        class="table-layout__text"
                                        th:text="${row.name}">
                                    홍길동
                                </span>
                        </td>

                        <td class="table-layout__cell">
                                <span
                                        class="table-layout__text"
                                        th:text="${row.email != null ? row.email : '-'}">
                                    hong@example.com
                                </span>
                        </td>

                        <td class="table-layout__cell">
                                <span
                                        class="table-layout__text"
                                        th:text="${row.phone != null ? row.phone : '-'}">
                                    010-1234-5678
                                </span>
                        </td>

                        <td class="table-layout__cell">
                                <span
                                        class="role-badge"
                                        th:classappend="${row.role == 'ROLE_ADMIN'} ? ' role-badge--admin' : ' role-badge--user'"
                                        th:text="${row.role == 'ROLE_ADMIN'} ? '관리자' : '일반 회원'">
                                    일반 회원
                                </span>
                        </td>

                        <td class="table-layout__cell">
                                <span
                                        class="table-layout__text"
                                        th:text="${row.createdAt != null ? #temporals.format(row.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                                    2026-04-27 10:00
                                </span>
                        </td>
                    </tr>

                    <tr
                            class="table-layout__row table-layout__row--empty"
                            th:if="${content == null or #lists.isEmpty(content)}">
                        <td
                                class="table-layout__cell table-layout__cell--empty"
                                colspan="6">
                            조회 된 데이터가 없습니다.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <th:block th:replace="~{common/table-layout :: tablePagination(
                paginationMode='server'
            )}"></th:block>
        </section>

    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const rows = document.querySelectorAll(".table-layout__row--clickable");

        rows.forEach((row) => {
            const moveToDetail = () => {
                const url = row.dataset.memberUrl;

                if (url) {
                    window.location.href = url;
                }
            };

            row.addEventListener("click", moveToDetail);

            row.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    moveToDetail();
                }
            });
        });
    });
</script>
</body>
</html>
