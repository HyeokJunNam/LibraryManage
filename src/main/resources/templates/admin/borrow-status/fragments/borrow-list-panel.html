<th:block
        th:fragment="borrowListPanel"
        xmlns:th="http://www.thymeleaf.org"
        th:with="
            resolvedContent=${content != null ? content : borrowListContent},
            resolvedPageMetaData=${pageMetaData != null ? pageMetaData : borrowListPageMetaData},
            safeSearchFields=${searchFields != null ? searchFields : (borrowListSearchFields != null ? borrowListSearchFields : T(java.util.Collections).emptyList())}
        ">

    <section
            id="borrowListPanel"
            class="panel-layout table-layout table-layout--fixed-height borrow-table-layout borrow-table-layout--list"
            th:attr="data-fragment-url=@{/admin/borrows/list}">

        <th:block th:replace="~{admin/common/table-layout :: tableHeader(
            title='대출 목록',
            caption='전체 도서 대출 이력을 확인할 수 있습니다.',
            actions=null
        )}"></th:block>

        <th:block
                th:replace="~{admin/common/table-layout :: tableToolbar(searchMode='ajax')}"
                th:with="searchFields=${safeSearchFields}">
        </th:block>

        <div class="table-layout__body">
            <table class="table-layout__table borrows-table">
                <thead class="table-layout__thead">
                <tr class="table-layout__row table-layout__row--head">
                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--leading">
                        <span class="table-layout__text">No</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">대출 ID</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">재고 ID</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">회원 번호</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">회원 ID</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">회원명</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">도서명</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">대출일</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">반납 예정일</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">반납일</span>
                    </th>

                    <th class="table-layout__cell table-layout__cell--head table-layout__cell--center-start">
                        <span class="table-layout__text">반납 상태</span>
                    </th>
                </tr>
                </thead>

                <tbody class="table-layout__tbody">
                <tr
                        class="table-layout__row"
                        th:each="borrowRecord, stat : ${resolvedContent}">

                    <td class="table-layout__cell table-layout__cell--leading">
                        <span
                                class="table-layout__text"
                                th:text="${resolvedPageMetaData != null
                                      ? (resolvedPageMetaData.page * resolvedPageMetaData.size + stat.index + 1)
                                      : (stat.index + 1)}">
                            1
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span
                                class="table-layout__text"
                                th:text="${borrowRecord.borrowRecordId != null ? borrowRecord.borrowRecordId : '-'}">
                            1
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span
                                class="table-layout__text"
                                th:text="${borrowRecord.bookCopyId != null ? borrowRecord.bookCopyId : '-'}">
                            1
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span
                                class="table-layout__text"
                                th:text="${borrowRecord.memberNo != null ? borrowRecord.memberNo : '-'}">
                            100
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span
                                class="table-layout__text"
                                th:text="${(borrowRecord.loginId != null and !#strings.isEmpty(borrowRecord.loginId))
                                      ? borrowRecord.loginId
                                      : '-'}">
                            ID
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span
                                class="table-layout__text"
                                th:text="${(borrowRecord.memberName != null and !#strings.isEmpty(borrowRecord.memberName))
                                      ? borrowRecord.memberName
                                      : '-'}">
                            홍길동
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--primary table-layout__cell--center-start">
                        <span
                                class="table-layout__text"
                                th:text="${(borrowRecord.bookTitle != null and !#strings.isEmpty(borrowRecord.bookTitle))
                                      ? borrowRecord.bookTitle
                                      : '-'}">
                            도서명
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span
                                class="table-layout__text"
                                th:text="${borrowRecord.borrowedAt != null
                                      ? #temporals.format(borrowRecord.borrowedAt, 'yyyy-MM-dd')
                                      : '-'}">
                            2026-05-01
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span
                                class="table-layout__text"
                                th:text="${borrowRecord.dueAt != null
                                      ? #temporals.format(borrowRecord.dueAt, 'yyyy-MM-dd')
                                      : '-'}">
                            2026-05-15
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span
                                class="table-layout__text"
                                th:text="${borrowRecord.returnedAt != null
                                      ? #temporals.format(borrowRecord.returnedAt, 'yyyy-MM-dd')
                                      : '-'}">
                            -
                        </span>
                    </td>

                    <td class="table-layout__cell table-layout__cell--center-start">
                        <span
                                class="status-badge"
                                th:classappend="${borrowRecord.returnStatus != null
                                               ? ' status-badge--' + #strings.toLowerCase(borrowRecord.returnStatus.value)
                                               : ' status-badge--default'}"
                                th:text="${(borrowRecord.returnStatus != null
                                        and borrowRecord.returnStatus.label != null
                                        and !#strings.isEmpty(borrowRecord.returnStatus.label))
                                      ? borrowRecord.returnStatus.label
                                      : '-'}">
                            반납 상태
                        </span>
                    </td>
                </tr>

                <tr
                        class="table-layout__row table-layout__row--empty"
                        th:if="${resolvedContent == null or #lists.isEmpty(resolvedContent)}">
                    <td class="table-layout__cell table-layout__cell--empty">
                        대출 내역이 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <th:block
                th:replace="~{common/pagination :: pagination(paginationMode='ajax')}"
                th:with="
                    pageMetaData=${resolvedPageMetaData},
                    searchFields=${safeSearchFields}
                ">
        </th:block>

    </section>
</th:block>
