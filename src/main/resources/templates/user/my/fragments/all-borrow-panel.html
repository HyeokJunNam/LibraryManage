<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="allBorrowPanel" class="section-card">
    <div class="section-card__header section-card__header--between">
        <div>
            <p class="section-card__eyebrow">ALL BORROWS</p>
            <h2 class="section-card__title">전체 대출 목록</h2>
        </div>

        <a th:href="@{/my/borrows}"
           href="/my/borrows"
           class="section-card__link">
            전체보기
        </a>
    </div>

    <div class="table-wrap">
        <table class="borrow-table">
            <thead>
            <tr>
                <th>도서명</th>
                <th>대출일</th>
                <th>반납예정일</th>
                <th>반납일</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="borrow : ${content}">
                <td th:text="${borrow.bookTitle}">이펙티브 자바</td>
                <td th:text="${#temporals.format(borrow.borrowedAt, 'yyyy-MM-dd')}">2026-05-01</td>
                <td th:text="${#temporals.format(borrow.dueAt, 'yyyy-MM-dd')}">2026-05-15</td>
                <td th:text="${borrow.returnedAt != null ? #temporals.format(borrow.returnedAt, 'yyyy-MM-dd') : '-'}">-</td>
                <td>
                    <span class="borrow-status"
                          th:text="${borrow.returnStatus.label}">
                        반납완료
                    </span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(allBorrows)}">
                <td colspan="5" class="borrow-table__empty">
                    대출 내역이 없습니다.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
