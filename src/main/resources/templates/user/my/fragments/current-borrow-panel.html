<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="currentBorrowPanel" class="section-card">
    <div class="section-card__header section-card__header--between">
        <div>
            <p class="section-card__eyebrow">CURRENT BORROWS</p>
            <h2 class="section-card__title">현재 대출 목록</h2>
        </div>

        <a th:href="@{/my/borrows(borrowStatistics='BORROWED')}"
           href="/my/borrows?borrowStatistics=BORROWED"
           class="section-card__link">
            더보기
        </a>
    </div>

    <div class="current-borrow-list">
        <article class="borrow-card" th:each="borrow : ${content}">
            <div class="borrow-card__icon" aria-hidden="true">📚</div>

            <div class="borrow-card__content">
                <strong class="borrow-card__title" th:text="${borrow.bookTitle}">클린 코드</strong>

                <div class="borrow-card__meta">
                    <span th:text="'대출일: ' + ${#temporals.format(borrow.borrowedAt, 'yyyy-MM-dd')}">
                        대출일: 2026-06-01
                    </span>
                    <span th:text="'반납예정일: ' + ${#temporals.format(borrow.dueAt, 'yyyy-MM-dd')}">
                        반납예정일: 2026-06-14
                    </span>
                </div>
            </div>

            <span class="borrow-card__badge"
                  th:text="${borrow.returnStatus.label}">
                대출중
            </span>
        </article>

        <div class="empty-box" th:if="${#lists.isEmpty(currentBorrows)}">
            현재 대출 중인 도서가 없습니다.
        </div>
    </div>
</section>
</body>
</html>
