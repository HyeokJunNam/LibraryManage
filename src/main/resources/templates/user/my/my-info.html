<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/common/user-layout}">

<head>
    <title>내 정보</title>
    <link rel="stylesheet" th:href="@{/css/user/my/my-info.css}">
</head>

<body>

<main layout:fragment="content" class="main-content">

    <section class="my-info flex-center">

        <article class="my-info__card">

            <header class="my-info__header">
                <h2 class="my-info__title">
                    내 정보
                </h2>

                <p class="my-info__description">
                    회원님의 기본 정보와 대출 현황을 확인할 수 있습니다.
                </p>
            </header>

            <section class="info-section">
                <header class="info-section__header">
                    <div>
                        <h3 class="info-section__title">
                            기본 정보
                        </h3>

                        <p class="info-section__description">
                            내 기본 정보를 확인할 수 있습니다.
                        </p>
                    </div>
                </header>

                <dl class="info-list">
                    <div class="info-list__item">
                        <dt class="info-list__label">ID</dt>
                        <dd class="info-list__value" th:text="${member.loginId}">
                            user01
                        </dd>
                    </div>

                    <div class="info-list__item">
                        <dt class="info-list__label">이름</dt>
                        <dd class="info-list__value" th:text="${member.name}">
                            홍길동
                        </dd>
                    </div>

                    <div class="info-list__item">
                        <dt class="info-list__label">이메일</dt>
                        <dd class="info-list__value" th:text="${member.email}">
                            user@email.com
                        </dd>
                    </div>

                    <div class="info-list__item">
                        <dt class="info-list__label">휴대폰번호</dt>
                        <dd class="info-list__value" th:text="${member.phoneNumber}">
                            010-1234-5678
                        </dd>
                    </div>
                </dl>
            </section>

            <section class="info-section">
                <header class="info-section__header">
                    <div>
                        <h3 class="info-section__title">
                            대출 정보
                        </h3>

                        <p class="info-section__description">
                            내 대출 현황을 확인할 수 있습니다.
                        </p>
                    </div>

                    <a href="/my/borrows"
                       class="info-section__more">
                        전체보기
                    </a>
                </header>

                <div class="borrow-stat-list">
                    <div class="borrow-stat-card">
                        <span class="borrow-stat-card__label">
                            누적 대출 도서 수
                        </span>

                        <span class="borrow-stat-card__value-group">
                            <span class="borrow-stat-card__value borrow-stat-card__value--total"
                                  th:text="${borrowStatistics.totalBorrowCount()}">
                                9
                            </span>

                            <span class="borrow-stat-card__unit">
                                권
                            </span>
                        </span>
                    </div>

                    <div class="borrow-stat-card">
                        <span class="borrow-stat-card__label">
                            대출 중인 도서 수
                        </span>

                        <span class="borrow-stat-card__value-group">
                            <span class="borrow-stat-card__value borrow-stat-card__value--borrowed"
                                  th:text="${borrowStatistics.currentBorrowCount()}">
                                3
                            </span>

                            <span class="borrow-stat-card__unit">
                                권
                            </span>
                        </span>
                    </div>

                    <div class="borrow-stat-card">
                        <span class="borrow-stat-card__label">
                            연체 도서 수
                        </span>

                        <span class="borrow-stat-card__value-group">
                            <span class="borrow-stat-card__value borrow-stat-card__value--overdue"
                                  th:text="${borrowStatistics.overdueCount()}">
                                1
                            </span>

                            <span class="borrow-stat-card__unit">
                                권
                            </span>
                        </span>
                    </div>
                </div>
            </section>

            <div class="my-info__actions">
                <a href="/my/edit/password-check" class="btn btn--edit">
                    정보 수정
                </a>

                <button type="button" class="btn btn--danger">
                    회원 탈퇴
                </button>
            </div>

        </article>

    </section>

</main>

<th:block layout:fragment="script">
</th:block>

</body>
</html>
