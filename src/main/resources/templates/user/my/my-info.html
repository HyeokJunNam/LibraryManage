<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 정보</title>
</head>
<body>
<div class="my-page">
    <div class="my-page__bg"></div>

    <main class="my-layout">
        <section class="my-hero">
            <a th:href="@{/}" href="/" class="my-hero__brand-link" aria-label="메인으로 이동">
                <span class="my-hero__brand-text">LIBRARY</span>
            </a>

            <div class="my-hero__content">
                <p class="my-hero__eyebrow">MY PAGE</p>
                <h1 class="my-hero__title">내 정보</h1>
                <p class="my-hero__description">
                    회원 정보와 도서 대출 현황을 확인할 수 있습니다.
                </p>
            </div>
        </section>

        <section class="my-content">
            <section class="my-card">
                <div class="my-card__header">
                    <p class="my-card__eyebrow">ACCOUNT INFO</p>
                    <h2 class="my-card__title">회원 정보</h2>
                </div>

                <div class="profile-box">
                    <div class="profile-box__avatar" aria-hidden="true">👤</div>
                    <div class="profile-box__text">
                        <strong th:text="${member.name}">홍길동</strong>
                        <span th:text="${member.loginId}">user01</span>
                    </div>
                </div>

                <div class="info-list">
                    <div class="info-item">
                        <span class="info-item__label">아이디</span>
                        <strong class="info-item__value" th:text="${member.loginId}">user01</strong>
                    </div>

                    <div class="info-item">
                        <span class="info-item__label">이름</span>
                        <strong class="info-item__value" th:text="${member.name}">홍길동</strong>
                    </div>

                    <div class="info-item">
                        <span class="info-item__label">휴대폰 번호</span>
                        <strong class="info-item__value" th:text="${member.phoneNumber}">010-1234-5678</strong>
                    </div>

                    <div class="info-item">
                        <span class="info-item__label">이메일</span>
                        <strong class="info-item__value" th:text="${member.email}">user@email.com</strong>
                    </div>
                </div>
            </section>
        </section>
    </main>
</div>
</body>
</html>
