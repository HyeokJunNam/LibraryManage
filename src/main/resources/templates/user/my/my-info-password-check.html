<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/common/user-layout}">

<head>
    <title>비밀번호 확인</title>

    <link rel="stylesheet"
          th:href="@{/css/user/my/my-info-password-check.css}">
</head>

<body>

<main layout:fragment="content" class="main-content">

    <section class="password-check flex-center">

        <article class="password-check__card">

            <header class="password-check__header">
                <h2 class="password-check__title">
                    비밀번호 확인
                </h2>

                <p class="password-check__description">
                    회원정보 수정을 위해 현재 비밀번호를 입력해 주세요.
                </p>
            </header>

            <form th:action="@{/my/edit/password-check}"
                  method="post"
                  class="password-check-form">

                <section class="info-section">

                    <h3 class="info-section__title">
                        본인 확인
                    </h3>

                    <p class="info-section__description">
                        정보 수정을 위해 현재 비밀번호를 확인합니다.
                    </p>

                    <div class="info-section__divider"></div>

                    <div class="form-field">

                        <label for="currentPassword"
                               class="form-field__label">
                            현재 비밀번호
                        </label>

                        <input id="currentPassword"
                               name="currentPassword"
                               type="password"
                               class="form-field__input"
                               placeholder="현재 비밀번호를 입력하세요"
                               autocomplete="current-password"
                               required>

                    </div>

                    <p class="form-field__error"
                       th:if="${errorMessage}"
                       th:text="${errorMessage}">
                        현재 비밀번호가 일치하지 않습니다.
                    </p>

                </section>

                <div class="password-check__actions">

                    <a th:href="@{/my}"
                       class="btn btn--cancel">
                        취소
                    </a>

                    <button type="submit"
                            class="btn btn--edit">
                        확인
                    </button>

                </div>

            </form>

        </article>

    </section>

</main>

<th:block layout:fragment="script">
</th:block>

</body>
</html>
