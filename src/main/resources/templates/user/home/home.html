<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user/common/user-layout}">

<head>
    <title>도서 검색</title>
    <link rel="stylesheet" th:href="@{/css/user/home/home.css}">
</head>

<body>

<main layout:fragment="content" class="main-content">

    <section class="home-section flex-center">

        <article class="search-card">

            <header class="search-card__header">
                <p class="search-card__label">
                    도서 검색 서비스
                </p>

                <h1 class="search-card__title">
                    찾고 싶은 책을 검색하세요
                </h1>

                <p class="search-card__description">
                    도서명, ISBN, 저자, 출판사 기준으로 원하는 도서를 빠르게 찾을 수 있습니다.
                </p>
            </header>

            <form id="searchForm"
                  class="search-form"
                  method="get"
                  th:action="@{/library/books}">

                <div class="search-form__row">

                    <div class="search-form__condition">
                        <label for="condition" class="visually-hidden">
                            검색 조건
                        </label>

                        <select id="condition" class="field__control">
                            <option th:each="field : ${searchFields}"
                                    th:value="${field.name}"
                                    th:text="${field.label}">
                                검색조건
                            </option>
                        </select>
                    </div>

                    <div class="search-form__keyword">
                        <label for="keyword" class="visually-hidden">
                            검색어
                        </label>

                        <input id="keyword"
                               type="text"
                               class="field__control"
                               placeholder="검색어를 입력하세요">
                    </div>

                    <div class="search-form__actions">
                        <button type="submit"
                                class="btn btn--search">
                            검색
                        </button>

                        <button type="button"
                                id="resetBtn"
                                class="btn btn--cancel">
                            초기화
                        </button>
                    </div>

                </div>

            </form>

        </article>

    </section>

</main>

<th:block layout:fragment="script">
    <script th:src="@{/js/user/home/home.js}"></script>
</th:block>

</body>
</html>
