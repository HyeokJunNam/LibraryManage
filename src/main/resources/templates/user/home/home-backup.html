<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>도서 검색 시스템</title>

    <link rel="stylesheet" th:href="@{/css/user/home-backup.css}">
</head>

<body>

<div class="layout">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="header">

        <!-- top -->
        <div class="inner top">

            <!-- logo -->
            <div class="logo-area">
                <img
                        th:src="@{/images/logo.png}"
                        alt="로고"
                >

                <a th:href="@{/}">
                    도서검색시스템
                </a>
            </div>

            <!-- right menu -->
            <div class="right-menu">
                <a th:href="@{/login}">
                    로그인
                </a>

                <a th:href="@{/signup}">
                    회원가입
                </a>
            </div>

        </div>



        <!-- menu -->
        <nav class="menu-bar">

            <div class="inner menu-list">

                <a href="#" class="menu-item">
                    <span class="icon">⌕</span>
                    <span>공지사항</span>
                </a>

                <a href="#" class="menu-item">
                    <span class="icon">🏛</span>
                    <span>도서관소개</span>
                </a>

                <a href="#" class="menu-item">
                    <span class="icon">📖</span>
                    <span>이용안내</span>
                </a>

                <a href="#" class="menu-item">
                    <span class="icon">⌖</span>
                    <span>대출현황</span>
                </a>

            </div>

        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================== -->
    <main class="main">

        <div class="inner">

            <!-- search -->
            <section class="search-card">

                <div class="search-info">
                    원하는 도서를 제목, 저자, 출판사로 검색할 수 있습니다.
                </div>

                <div class="search-box">

                    <!-- select -->
                    <label
                            for="searchCondition"
                            class="visually-hidden"
                    >
                        검색 종류
                    </label>

                    <select id="searchCondition">
                        <option>제목</option>
                        <option>저자</option>
                        <option>출판사</option>
                    </select>



                    <!-- input -->
                    <label
                            for="keyword"
                            class="visually-hidden"
                    >
                        검색어
                    </label>

                    <input
                            id="keyword"
                            type="text"
                            placeholder="검색어를 입력하세요"
                    >



                    <!-- button -->
                    <button type="button">
                        검색
                    </button>

                </div>

            </section>



            <!-- banner -->
            <section class="banner-area">

                <div class="banner">

                    <p>
                        도서 검색 시스템에 오신 걸 환영합니다
                    </p>

                </div>

            </section>

            <div class="content-section">

                <!-- 공지사항 -->
                <section class="notice-section">

                    <div class="section-header">
                        공지사항
                    </div>

                    <div class="section-body">

                        <div class="notice-list">

                            <a href="#" class="notice-item">
                                <span class="notice-title">도서관 운영시간 변경 안내</span>
                                <span class="notice-date">2026-05-01</span>
                            </a>

                            <a href="#" class="notice-item">
                                <span class="notice-title">도서관 운영시간 변경 안내</span>
                                <span class="notice-date">2026-05-01</span>
                            </a>

                        </div>

                    </div>

                </section>



                <!-- 추천도서 -->
                <section class="recommend-section">

                    <div class="section-header">
                        추천 도서
                    </div>

                    <div class="section-body">

                        <div class="recommend-list">

                            <div class="book-card">

                                <img
                                        th:src="@{/images/book1.jpg}"
                                        alt="도서 이미지"
                                >

                                <div class="book-title">
                                    어린 왕자
                                </div>

                            </div>

                        </div>

                    </div>

                </section>

            </div>

        </div>

    </main>

    <footer class="footer">

        <div class="inner">

            <p>
                © 2026 도서검색시스템. All Rights Reserved.
            </p>

        </div>

    </footer>

</div>

</body>

</html>
