<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 목록</title>
    <th:block th:replace="~{/user/common/user-page-assets :: assets}"></th:block>

    <link rel="stylesheet" th:href="@{/css/user/books/books.css}">
</head>
<body>
<div class="layout">

    <div th:replace="~{/user/common/topbar :: topbar}"></div>

    <div class="book-list">
        <main class="book-list__page">

            <section class="search-panel">
                <div class="search-panel__head">
                    <div>
                        <h1 class="search-panel__title">도서 검색</h1>
                        <p class="search-panel__desc">전체 도서와 검색 결과를 이 화면에서 바로 확인할 수 있습니다.</p>
                    </div>
                </div>

                <form id="searchForm" class="search-form">
                    <div class="search-form__row">
                        <div class="field field--select">
                            <label for="condition" class="visually-hidden">검색 조건</label>
                            <select id="condition" class="field__control">
                                <option value="title">도서명</option>
                                <option value="isbn">ISBN</option>
                                <option value="author">저자</option>
                                <option value="publisher">출판사</option>
                            </select>
                        </div>

                        <div class="field field--input">
                            <label for="keyword" class="visually-hidden">검색어</label>
                            <input
                                    id="keyword"
                                    type="text"
                                    class="field__control"
                                    placeholder="검색어를 입력하세요"
                            >
                        </div>

                        <div class="search-form__actions">
                            <button type="submit" class="btn btn--primary">검색</button>
                            <button type="button" id="resetBtn" class="btn btn--outline">초기화</button>
                        </div>
                    </div>
                </form>
            </section>

            <section class="book-results" aria-labelledby="bookResultsTitle">
                <div class="book-results__head">
                    <div>
                        <h2 id="bookResultsTitle" class="book-results__title">도서 목록</h2>
                        <p class="book-results__desc">
                            전체 도서 또는 검색된 도서를 확인할 수 있습니다.
                        </p>
                    </div>

                    <div class="book-results__count">
                        전체
                        <strong th:text="${pageMetaData != null ? pageMetaData.totalElements() : 0}">0</strong>건
                    </div>
                </div>

                <div
                        class="book-card-list"
                        th:if="${content != null and !#lists.isEmpty(content)}">

                    <a
                            class="book-card"
                            th:each="row, rowStat : ${content}"
                            th:href="@{/library/books/{id}(id=${row.id})}"
                            th:attr="aria-label=${row.title + ' 상세 정보 보기'}">

                        <div class="book-card__image">
                            <div class="book-card__no-image">
                                <span>No Image</span>
                            </div>
                        </div>

                        <div class="book-card__body">
                            <div class="book-card__main">
                                <div class="book-card__title-area">
                                    <h3
                                            class="book-card__title"
                                            th:text="${row.title}">
                                        도서명
                                    </h3>
                                </div>

                                <span class="book-card__status book-card__status--available">
                                    대출가능
                                </span>
                            </div>

                            <div class="book-card__meta">
                                <div class="book-card__meta-row">
                                    <span class="book-card__label">저자</span>
                                    <span
                                            class="book-card__value"
                                            th:text="${row.author != null ? row.author : '-'}">
                                        저자
                                    </span>
                                </div>

                                <div class="book-card__meta-row">
                                    <span class="book-card__label">출판사</span>
                                    <span
                                            class="book-card__value"
                                            th:text="${row.publisher != null ? row.publisher : '-'}">
                                        출판사
                                    </span>
                                </div>

                                <div class="book-card__meta-row">
                                    <span class="book-card__label">ISBN</span>
                                    <span
                                            class="book-card__value"
                                            th:text="${row.isbn != null ? row.isbn : '-'}">
                                        ISBN
                                    </span>
                                </div>
                            </div>

                            <div class="book-card__bottom">
                                <div class="book-card__tags">
                                    <span
                                            class="book-tag"
                                            th:if="${row.author != null}"
                                            th:text="${'#' + row.author}">
                                        #저자
                                    </span>

                                    <span
                                            class="book-tag"
                                            th:if="${row.publisher != null}"
                                            th:text="${'#' + row.publisher}">
                                        #출판사
                                    </span>

                                    <span
                                            class="book-tag"
                                            th:if="${row.isbn != null}">
                                        #ISBN
                                    </span>
                                </div>

                                <span class="book-card__detail">상세보기</span>
                            </div>
                        </div>
                    </a>
                </div>

                <div
                        class="empty-block"
                        th:if="${content == null or #lists.isEmpty(content)}">
                    <div class="empty-block__icon">📚</div>
                    <p class="empty-block__title">조회 된 도서가 없습니다.</p>
                    <p class="empty-block__desc">검색어를 변경하거나 초기화 후 다시 조회해 주세요.</p>
                </div>

                <div class="book-results__pagination">
                    <th:block th:replace="~{common/table-layout :: tablePagination(
                        paginationMode='server'
                    )}"></th:block>
                </div>
            </section>

        </main>
    </div>
</div>


</body>
</html>
